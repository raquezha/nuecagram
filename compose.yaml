services:
  postgres:
    image: ${NUECAGRAM_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${NUECAGRAM_IMAGE:-raquezha/nuecagram:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NUECAGRAM_BIND:-8080:8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-8080}$${NUECAGRAM_HEALTH_PATH:-/nuecagram/health/ready} || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
