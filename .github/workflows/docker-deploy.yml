name: Build & Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Main-branch commit SHA to publish and deploy (defaults to HEAD)
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  publish:
    needs: [lint, test, build, dependency-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha_tag: ${{ steps.sha_tag.outputs.sha_tag }}
      version: ${{ steps.push-image.outputs.version }}
      version_tag: ${{ steps.push-image.outputs.tag }}
      release_sha: ${{ steps.resolve-version.outputs.release_sha }}
    env:
      MERGE_SHA: ${{ inputs.merge_sha }}
    steps:
      - name: Resolve commit SHA & tag
        id: sha_tag
        run: |
          target_sha="${MERGE_SHA:-$GITHUB_SHA}"
          sha_tag="sha-$(printf '%.12s' "$target_sha")"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha_tag.outputs.target_sha }}
          fetch-depth: 0

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          overwrite-settings: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version tag
        id: resolve-version
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.txt must contain x.y.z" >&2
            exit 1
          fi
          tag="v$version"
          git fetch origin --tags || true
          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists. Bump version.txt through a release PR before deploying." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: ./gradlew --build-cache buildImage buildFatJar
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Prepare release artifacts
        run: |
          version="${{ steps.resolve-version.outputs.version }}"
          mkdir -p release-artifacts
          cp build/libs/nuecagram-fat.jar "release-artifacts/nuecagram-$version-fat.jar"
          sha256sum "release-artifacts/nuecagram-$version-fat.jar" > release-artifacts/checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Load Docker image
        run: docker load -i build/jib/nuecagram-jib-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tag and push immutable image
        id: push-image
        run: |
          version="${{ steps.resolve-version.outputs.version }}"
          tag="${{ steps.resolve-version.outputs.tag }}"
          version_ref="raquezha/nuecagram:$tag"
          sha_ref="raquezha/nuecagram:${{ steps.sha_tag.outputs.sha_tag }}"
          docker tag "nuecagram-docker-image:$version" "$version_ref"
          docker tag "nuecagram-docker-image:$version" "$sha_ref"
          docker push "$version_ref"
          docker push "$sha_ref"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  auto-deploy:
    needs: publish
    uses: ./.github/workflows/deploy-production.yml
    with:
      action: deploy
      image_digest: raquezha/nuecagram:${{ needs.publish.outputs.version_tag }}
    secrets: inherit

  release:
    needs: [publish, auto-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.publish.outputs.version_tag }}"
          version="${{ needs.publish.outputs.version }}"
          target_sha="${{ needs.publish.outputs.release_sha }}"
          git fetch origin --tags || true
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$target_sha"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            previous_tag=$(git describe --tags --abbrev=0 "$target_sha^" 2>/dev/null || true)
            range="$target_sha"
            if [ -n "$previous_tag" ]; then
              range="$previous_tag..$target_sha"
            fi
            features=$(mktemp)
            fixes=$(mktemp)
            deployment=$(mktemp)
            maintenance=$(mktemp)
            docs=$(mktemp)
            other=$(mktemp)
            while IFS=$'\t' read -r subject short_sha; do
              item="* $subject ($short_sha)"
              case "$subject" in
                feat*) echo "$item" >> "$features" ;;
                fix*) echo "$item" >> "$fixes" ;;
                ci*|build*) echo "$item" >> "$deployment" ;;
                chore*|refactor*|perf*|test*) echo "$item" >> "$maintenance" ;;
                docs*) echo "$item" >> "$docs" ;;
                *) echo "$item" >> "$other" ;;
              esac
            done < <(git log --reverse --format='%s%x09%h' "$range")
            {
              echo "## What's Changed"
              if [ -s "$features" ]; then echo; echo "### Features"; cat "$features"; fi
              if [ -s "$fixes" ]; then echo; echo "### Fixes"; cat "$fixes"; fi
              if [ -s "$deployment" ]; then echo; echo "### CI / Deployment"; cat "$deployment"; fi
              if [ -s "$maintenance" ]; then echo; echo "### Maintenance"; cat "$maintenance"; fi
              if [ -s "$docs" ]; then echo; echo "### Documentation"; cat "$docs"; fi
              if [ -s "$other" ]; then echo; echo "### Other"; cat "$other"; fi
              if ! [ -s "$features" ] && ! [ -s "$fixes" ] && ! [ -s "$deployment" ] && ! [ -s "$maintenance" ] && ! [ -s "$docs" ] && ! [ -s "$other" ]; then
                echo
                echo "No user-facing changes in this release."
              fi
              echo
              echo "## Deployment"
              echo "* Docker image: \`raquezha/nuecagram:$tag\`"
              echo "* Published from commit: \`$target_sha\`"
              if [ -n "$previous_tag" ]; then
                echo
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$tag"
              fi
            } > release-notes.md
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target_sha" \
              --title "v$version" \
              --notes-file release-notes.md \
              "release-artifacts/nuecagram-$version-fat.jar" \
              "release-artifacts/checksums.txt"
          fi
