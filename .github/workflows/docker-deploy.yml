name: Build & Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Main-branch commit SHA to publish and deploy (defaults to HEAD)
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  publish:
    needs: [lint, test, build, dependency-scan]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push-image.outputs.sha_ref }}
    env:
      MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0

      - name: Resolve SHA tag
        id: sha_tag
        run: |
          sha_tag="sha-$(printf '%.12s' "$MERGE_SHA")"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          overwrite-settings: false

      - name: Build release artifacts
        run: ./gradlew buildImage buildFatJar
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Load Docker image
        run: docker load -i build/jib/nuecagram-jib-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tag and push immutable image
        id: push-image
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          tag="v$version"
          version_ref="raquezha/nuecagram:$tag"
          sha_ref="raquezha/nuecagram:${{ steps.sha_tag.outputs.sha_tag }}"
          docker tag "nuecagram-docker-image:$version" "$version_ref"
          docker tag "nuecagram-docker-image:$version" "$sha_ref"
          docker push "$version_ref"
          docker push "$sha_ref"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_ref=$sha_ref" >> "$GITHUB_OUTPUT"

      - name: Generate checksums & Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.push-image.outputs.tag }}"
          version="${{ steps.push-image.outputs.version }}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$MERGE_SHA"
            git push origin "$tag" || true
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cd build/libs
            sha256sum "nuecagram-fat.jar" > checksums.txt
            cd ../jib
            sha256sum "nuecagram-jib-image.tar" >> ../libs/checksums.txt
            cd ../..
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" \
              --title "v$version" \
              --generate-notes \
              "build/libs/nuecagram-fat.jar#nuecagram-$version-fat.jar" \
              "build/jib/nuecagram-jib-image.tar#nuecagram-$version.jib.tar" \
              "build/libs/checksums.txt#checksums.txt" || true
          fi

  auto-deploy:
    needs: publish
    uses: ./.github/workflows/deploy-production.yml
    with:
      action: deploy
      image_digest: ${{ needs.publish.outputs.image_digest }}
    secrets: inherit
