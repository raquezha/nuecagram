name: Build & Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Main-branch commit SHA to publish and deploy (defaults to HEAD)
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  publish:
    needs: [lint, test, build, dependency-scan]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push-image.outputs.digest }}
    env:
      MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0

      - name: Resolve SHA tag
        id: sha_tag
        run: |
          sha_tag="sha-$(printf '%.12s' "$MERGE_SHA")"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          overwrite-settings: false

      - name: Build Docker image
        run: ./gradlew buildImage
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Load Docker image
        run: docker load -i build/jib/nuecagram-jib-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Tag and push immutable image
        id: push-image
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          sha_ref="raquezha/nuecagram:${{ steps.sha_tag.outputs.sha_tag }}"
          docker tag "nuecagram-docker-image:$version" "$sha_ref"
          docker push "$sha_ref"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$sha_ref")
          if [ -z "$digest" ]; then
            echo "Failed to resolve repository digest for $sha_ref" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  auto-deploy:
    needs: publish
    uses: ./.github/workflows/deploy-production.yml
    with:
      action: deploy
      image_digest: ${{ needs.publish.outputs.image_digest }}
    secrets: inherit
