services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ${NUECAGRAM_ENV_FILE:-.env}
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${NUECAGRAM_IMAGE:?set NUECAGRAM_IMAGE}
    restart: unless-stopped
    env_file:
      - path: ${NUECAGRAM_ENV_FILE:-.env}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-8080}/nuecagram/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
