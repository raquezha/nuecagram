<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telegram Access Required</title>
    <style>
      :root {
        --bg-color: #f4f5f8;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --hint: #64748b;
        --button: #0284c7;
        --button-text: #ffffff;
        --border: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg-color); color: var(--text-main); font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
      .guidance-card { max-width: 440px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: inset 0 0 0 1px var(--border), 0 10px 25px -5px rgba(0,0,0,0.05); }
      .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #e0f2fe; color: var(--button); display: flex; align-items: center; justify-content: center; }
      h1 { margin: 0 0 12px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: var(--hint); line-height: 1.5; font-size: 14px; }
      .badge { display: inline-block; background: #f1f5f9; border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 24px; }
      a.btn-telegram { display: block; width: 100%; background: var(--button); color: var(--button-text); text-decoration: none; padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="guidance-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Telegram Access Required</h1>
      <p>This management portal must be opened inside Telegram.</p>
      <div class="badge">Open @NuecagramBot and tap OPEN</div>
      <a href="https://t.me/NuecagramBot" class="btn-telegram" target="_blank" rel="noopener">Open Telegram Bot</a>
    </div>
  </body>
</html>
