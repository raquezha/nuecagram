<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuecagram Management</title>
    <style>
      :root {
        --bg-color: #f4f5f8;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --hint: #64748b;
        --button: #0284c7;
        --button-text: #ffffff;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0f172a;
          --card-bg: #1e293b;
          --text-main: #f8fafc;
          --hint: #94a3b8;
          --border: #334155;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg-color); color: var(--text-main); font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .container { max-width: 480px; margin: 0 auto; padding: 18px 14px 28px; min-height: 100vh; display: flex; align-items: center; }
      .box { width: 100%; padding: 28px 20px; border-radius: 18px; background: var(--card-bg); box-shadow: inset 0 0 0 1px var(--border); text-align: center; }
      .lock { font-size: 48px; line-height: 1; margin-bottom: 14px; }
      h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.1; letter-spacing: -0.03em; }
      p { margin: 0 0 18px; color: var(--hint); line-height: 1.5; }
      .button { display: block; width: 100%; border: 0; border-radius: 12px; background: var(--button); color: var(--button-text); padding: 12px 14px; font: 700 14px inherit; text-decoration: none; }
      .meta { margin-top: 14px; font-size: 12px; color: var(--hint); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="lock">🔒</div>
        <h1>Telegram Access Required</h1>
        <p>This management portal must be opened inside Telegram.<br>Open <strong>@NuecagramBot</strong> and tap <strong>OPEN</strong>.</p>
        <a class="button" href="https://t.me/NuecagramBot" target="_blank" rel="noopener">Open Telegram Bot</a>
        <div class="meta">Static sample preview for direct browser access</div>
      </div>
    </div>
  </body>
</html>
